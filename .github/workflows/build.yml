name: Build CrateSystem

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven ile derle
        run: mvn -B clean package

      - name: Jar dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: CrateSystem-jar
          path: target/CrateSystem.jar
          if-no-files-found: error
